name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: harness-loop tests
        run: python3 -m unittest discover -s harness-loop/tests
      - name: agent-cli tests
        run: python3 -m unittest discover -s .claude/cli/tests
      - name: Compile Python
        run: python3 -m py_compile $(git ls-files 'harness-loop/*.py' '.claude/*.py')
      - name: Check hook scripts
        run: for f in .claude/hooks/*.sh; do bash -n "$f" || exit 1; done
      - name: Check settings.json
        run: python3 -m json.tool .claude/settings.json >/dev/null

  leak:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HARNESS_LOOP_HOME: ${{ runner.temp }}/hl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write private leak patterns
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            echo "::error::LEAK_PATTERNS secret is missing or empty; set it in the repository secrets (private patterns, one regex per line). Fork PRs cannot read secrets: push the branch to this repository instead."
            exit 1
          fi
          mkdir -p "$HARNESS_LOOP_HOME"
          printf '%s\n' "$LEAK_PATTERNS" > "$HARNESS_LOOP_HOME/leak-patterns.txt"
      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body.md"
      - name: Leak scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 harness-loop/loop.py leak --redact --diff "origin/$BASE_REF" --body "$RUNNER_TEMP/body.md"
